<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday My Love ❤️</title>

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:radial-gradient(circle at top, #3a0000, #000000);
    height:100vh;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    text-align:center;
}

.container{
    background:rgba(0,0,0,0.55);
    padding:30px;
    border-radius:30px;
    max-width:540px;
    box-shadow:0 0 40px rgba(255,0,0,0.4);
    animation:fadeIn 2s;
}

h1{ color:#ff4d6d; }
h2{ color:#ff9aa2; }

.cake{
    width:200px;
    cursor:pointer;
    margin:20px auto;
    animation:bounce 1.5s infinite;
    filter:drop-shadow(0 0 20px rgba(255,0,0,0.6));
}

.hint{
    font-size:14px;
    opacity:0.85;
}

.gift{
    display:none;
    animation:openGift 2s ease;
}

.photos img{
    width:130px;
    border-radius:20px;
    margin:8px;
    border:2px solid #ff4d6d;
    box-shadow:0 0 15px rgba(255,0,0,0.5);
}

.letter{
    margin-top:15px;
    font-size:1.15em;
    min-height:150px;
    color:#ffd6e0;
}

@keyframes bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-15px);}
}

@keyframes fadeIn{
    from{opacity:0;transform:scale(0.9);}
    to{opacity:1;transform:scale(1);}
}

@keyframes openGift{
    from{opacity:0;transform:scale(0.7) rotate(-5deg);}
    to{opacity:1;transform:scale(1) rotate(0);}
}

.floating-heart{
    position:absolute;
    bottom:-40px;
    font-size:36px;
    animation:floatUp 7s linear infinite;
    opacity:0.9;
}

@keyframes floatUp{
    from{transform:translateY(0) scale(1);}
    to{transform:translateY(-120vh) scale(1.3);}
}
</style>
</head>

<body>

<audio id="music" loop>
    <source src="song.mp3" type="audio/mpeg">
</audio>

<div class="container">
    <h1>Happy Birthday 🎂</h1>
    <h2>Mahnoor ❤️</h2>

    <p>
        My Moti 😘<br>
        My Churail 😜<br>
        My cute Chipkali 🦎
    </p>

    <img src="cake.png" class="cake" onclick="openGift()" alt="Cake">

    <div class="hint">Tap the cake my jaan ❤️</div>

    <div class="gift" id="giftBox">
        <h2>🎁 Just For You</h2>

        <div class="photos">
            <img src="pic1.jpg">
            <img src="pic2.jpg">
        </div>

        <div class="letter" id="letter"></div>

        <p style="margin-top:15px;"><i>Forever yours — Your Husband ❤️</i></p>
    </div>
</div>

<script>
function openGift(){
    document.getElementById("giftBox").style.display="block";
    document.getElementById("music").play();
    typeLetter();
}

const text = `
My Mahnoor ❤️,

You are the calm in my chaos,
the smile I search for every day.

Moti ho ya Churail,
Chipkali ho ya Queen —
you are my most beautiful habit.

On your birthday,
I don’t just celebrate your birth,
I celebrate my luck.

Happy Birthday my jaan 🎂
I love you endlessly 💍
`;

let i=0;
function typeLetter(){
    if(i < text.length){
        document.getElementById("letter").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeLetter,45);
    }
}

const hearts=["❤️","💖","💘","💕"];
setInterval(()=>{
    let h=document.createElement("div");
    h.className="floating-heart";
    h.innerText=hearts[Math.floor(Math.random()*hearts.length)];
    h.style.left=Math.random()*100+"vw";
    h.style.animationDuration=(5+Math.random()*3)+"s";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),8000);
},300);
</script>

</body>
</html>
